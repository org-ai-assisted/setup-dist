## Root-owned, not group/world-writable: the "setup done" markers here are
## written by root via privleap (setup-dist-done, repository-dist). A 'd' entry
## also re-asserts the mode on upgrade, hardening systems that still carry the
## old world-writable directory.
d /var/cache/setup-dist/status-files 0755 root root -
